# Bitbucket Pipeline for fractals-nextjs using devops-gcp-pulumi CLI
#
# Required Repository Variables:
#   GCP_PROJECT          - GCP project ID
#   GCP_PROJECT_NUMBER   - GCP project number (for WIF)
#   GCP_REGION           - GCP region (e.g., us-central1)
#   STATE_BUCKET         - GCS bucket name for Pulumi state
#   SERVICE_ACCOUNT_EMAIL - Deploy service account email
#
# Required Repository Variables (Secured):
#   PULUMI_CONFIG_PASSPHRASE - State encryption passphrase

image: node:22-alpine

definitions:
  services:
    docker:
      memory: 2048

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Test Next.js App
            caches:
              - node
            script:
              - npm ci
              - npm run build
              - npm run lint
              - npx tsc --noEmit

        - step:
            name: Deploy to Cloud Run
            oidc: true
            services:
              - docker
            caches:
              - node
              - docker
            script:
              - apk add --no-cache git curl bash
              - curl -fsSL https://get.pulumi.com | sh
              - export PATH=$PATH:$HOME/.pulumi/bin
              - git clone https://bitbucket.org/sloanahrens/devops-gcp-pulumi.git infra
              - cd infra/cli && npm ci
              - npx devops-gcp deploy --app fractals-nextjs --branch "$BITBUCKET_BRANCH" --context "$BITBUCKET_CLONE_DIR"

  custom:
    branch-cleanup:
      - variables:
          - name: DELETED_BRANCH
            description: "Name of the deleted branch to clean up"
        step:
          name: Cleanup Branch Resources
          oidc: true
          script:
            - apk add --no-cache git curl bash
            - curl -fsSL https://get.pulumi.com | sh
            - export PATH=$PATH:$HOME/.pulumi/bin
            - git clone https://bitbucket.org/sloanahrens/devops-gcp-pulumi.git infra
            - cd infra/cli && npm ci
            - npx devops-gcp cleanup --app fractals-nextjs --branch "$DELETED_BRANCH"
