# Bitbucket Pipeline for fractals-nextjs - Azure Container Apps deployment
#
# Required Repository Variables:
#   AZURE_CLIENT_ID          - Deploy managed identity client ID
#   AZURE_TENANT_ID          - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
#   AZURE_RESOURCE_GROUP     - Resource group name (e.g., trabian_west_sbx)
#   STATE_STORAGE_ACCOUNT    - Storage account for Pulumi state
#   AZURE_LOCATION           - Azure region (e.g., westus2)
#
# Required Repository Variables (Secured):
#   PULUMI_CONFIG_PASSPHRASE - State encryption passphrase

image: node:22

definitions:
  caches:
    npm: ~/.npm
  services:
    docker:
      memory: 2048

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Test Next.js App
            caches:
              - npm
            script:
              - npm ci
              - npm run build
              - npm run lint
              - npx tsc --noEmit

        - step:
            name: Deploy to Container Apps
            oidc: true
            services:
              - docker
            caches:
              - npm
            script:
              # Install Azure CLI
              - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
              # Install Pulumi
              - curl -fsSL https://get.pulumi.com | bash
              - export PATH=$PATH:$HOME/.pulumi/bin
              # Login with OIDC
              - |
                az login --service-principal \
                  --username $AZURE_CLIENT_ID \
                  --tenant $AZURE_TENANT_ID \
                  --federated-token $BITBUCKET_STEP_OIDC_TOKEN
              - az account set --subscription $AZURE_SUBSCRIPTION_ID
              # Clone infra repo and deploy
              - git clone --depth 1 https://github.com/sloanahrens/devops-pulumi-ts.git infra
              - cd infra/cli && npm ci && npm run build
              - |
                npx devops-deploy deploy \
                  --cloud azure \
                  --app fractals-nextjs \
                  --branch "$BITBUCKET_BRANCH" \
                  --context "$BITBUCKET_CLONE_DIR"
              - echo "Service URL - $(cat /tmp/service-url.txt)"

  custom:
    branch-cleanup:
      - variables:
          - name: DELETED_BRANCH
            description: "Name of the deleted branch to clean up"
        step:
          name: Cleanup Branch Resources
          oidc: true
          script:
            - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
            - curl -fsSL https://get.pulumi.com | bash
            - export PATH=$PATH:$HOME/.pulumi/bin
            - |
              az login --service-principal \
                --username $AZURE_CLIENT_ID \
                --tenant $AZURE_TENANT_ID \
                --federated-token $BITBUCKET_STEP_OIDC_TOKEN
            - az account set --subscription $AZURE_SUBSCRIPTION_ID
            - git clone --depth 1 https://github.com/sloanahrens/devops-pulumi-ts.git infra
            - cd infra/cli && npm ci && npm run build
            - |
              npx devops-deploy cleanup \
                --cloud azure \
                --app fractals-nextjs \
                --branch "$DELETED_BRANCH"
