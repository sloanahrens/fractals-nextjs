# Staging-on-landing workflow template for an app repo (bead dv-pj9).
#
# Copy this file into an app repo as .forgejo/workflows/staging.yml, next to
# deploy.yml and teardown.yml. It deploys the app's main to its staging stack
# after every landing, so a change that landed can be watched where it landed
# instead of waiting for the next release: build the commit main is at, apply
# that digest to staging, check its health, and test that service. Nothing else.
# Five jobs, and there is no sixth: the later half of the release flow belongs
# to deploy.yml and to a protected `v*` tag the human pushes, and nothing in
# this file names, reaches or rebuilds for it.
#
# The first of the five is `off` (bead dv-sve9), and it decides whether the app
# is off on purpose. An owner who takes an app down puts a plain file,
# deploy/OFF, in the app repo (their wrapper adds and removes it), and a landing
# while it is there must not recreate the staging service the owner took down.
# `off` checks the run's commit out and looks for the file. When it is there the
# run summary says "app is off on purpose (deploy/OFF): staging deploy and
# integration skipped", and `fresh`, `build`, `staging` (whose last step is the
# health check) and `integration` are all skipped. Skipped, not success, for the
# reason `fresh` is a job (below): the release bot reads a run's job statuses, and
# an `integration` job that read success would say a commit was deployed and
# tested when nothing ran. The run itself still ends green, because `off` is a
# job that succeeded, so the gate that reads the run's status is not left waiting
# on a landing that has nothing to deploy; the release bot has its own app_off
# rule and releases nothing from an app that is off. Unit CI is not in this
# file and is not affected. Without deploy/OFF the file behaves as it did before
# `off` existed: each condition below reduces to the `fresh` one it carried.
#
# The second of the five is `fresh`, and it is its own job rather than a step
# inside the others (bead dv-7gsb). Landings arrive every few minutes, so a
# queued run is usually superseded before it starts; a job that skips its own
# steps still ends with status success, and the release bot and the dashboard's
# Deploys block both read a run's *job statuses* to decide whether a commit was
# deployed and tested. A superseded run whose jobs all read success therefore
# says a commit reached staging and passed the integration tier when it reached
# neither. So the read that compares main with the run's commit is a job of its own,
# the three jobs that do the work depend on it, and each carries the same answer
# as a job-level condition: a superseded run's jobs are skipped, which is not
# success.
#
# The last job is the integration tier (bead dv-sdpq; the design is
# docs/plans/2026-10-08-automated-release-design.md, section 2). "Green" for a
# commit has to mean one thing — the deploy of that commit answered — and only a
# test tied to the deploy can say it: a periodic sweep would run against
# whichever commit staging happens to serve when it fires, so "tested" and
# "live" would be two facts that never coincide. So the integration job waits
# for the service to report the commit the run deployed and then runs the app's
# own `make integration` against it, and its result is what the release reads as
# "this commit is green on staging".
#
# That job runs on `runs-on: ci-base`, and that is the point of it: an app's
# integration tests need no cloud credential to do their work, so the runner
# that holds none is the runner that runs them. The job therefore holds no key
# path and calls no script that mints a token. The base key in this file is
# declared on the two jobs that run on the deploy runner rather than at the top
# of the file, because a workflow-level variable is inherited by every job, the
# `off`, `fresh` and `integration` ones included: an inherited variable is a key path
# the job holds.
#
# What authorizes a run here is main itself, and that is why this template
# carries no ref guard where deploy.yml carries one. main only ever moves
# through the gated landing worker (the ci gate and om review), so a commit that
# is on main has passed that gate, and one that is not is refused by the build
# itself: build_push_staging.sh checks that HEAD is on main before it builds
# anything. A run started at a branch of a worker's own -- a dispatch names any
# ref, and the copy of the file that runs is the copy at that ref (beads dv-csz
# and dv-x3a) -- therefore has nothing to deploy, because the branch's commit is
# not on main. The `fresh` job below closes the other half of it: a run whose
# commit main has moved past is skipped, and every job that would deploy or test
# depends on it.
#
# The jobs that build and deploy run on `runs-on: deploy` for the same reason
# deploy.yml does: that label is the only runner with the base key, and Forgejo
# restricts it to the app repos (bead B5.4). No file here holds a credential, and
# each checkout sets persist-credentials: false so the runner's own repository
# token is not left in .git/config for a later step to pick up (deploy.yml says
# why at length).

name: staging

# A landing on main, and nothing else: one branch, no path filter, no second
# event. The landing worker is the only account that pushes main.
on:
  push:
    branches: [main]

# The group deploy.yml and teardown.yml declare, and deliberately the same one.
# On this Forgejo a concurrency group is shared across every workflow in the
# repository, so one group is one queue for all three flows whether or not they
# name each other (the reference is quoted in workflows/README.md). A landing
# waits behind a release and behind another landing, and no run here cancels
# anything.
#
# cancel-in-progress: false is why the group is shared rather than separate.
# With `true`, an arriving landing would cancel the previous invocation in the
# group -- which, on this instance, can be a running release, stopped half-way
# through a stack it was writing. A queued landing costs a wait; a cancelled
# release costs a stack nobody can read.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  # Four of the five settings deploy.yml states, for the reasons it gives there:
  # the app's name is its repository's, its project was fixed when bootstrap
  # created it and is not derived from that name, and the stack directory and
  # health path are the app's own. The fifth, GT_BASE_KEY_FILE, is declared on
  # the jobs below that run on the deploy runner: it is a key path, and the
  # `fresh` and `integration` jobs are jobs that must hold none, so the
  # declaration sits where the key is mounted rather than where every job would
  # inherit it.
  GT_APP: ${{ github.event.repository.name }}
  GT_PROJECT: gt-fractals-m4xq
  GT_STACK_DIR: deploy
  GT_HEALTH_PATH: /api/health

jobs:
  # Whether the app is off on purpose (bead dv-sve9), decided before anything
  # else, and for the same reason `fresh` is a job: the answer has to be the
  # *run's* status, and a step that skipped its own work would end with success.
  # Every job below needs this one and carries its answer as a job-level
  # condition, so an app that is off has jobs whose status is skipped.
  #
  # It runs on the CI runner and holds nothing: the file is read from a checkout
  # of the run's commit, which keeps no token, and the job names no key path and
  # calls no script that mints one. It changes nothing.
  #
  # The check fails closed on the one thing it cannot tell. A checkout that
  # fails fails this job, and the jobs below are then skipped for want of it: a
  # run that cannot read the repo deploys nothing, and says so as a failed run
  # rather than as a green one.
  off:
    runs-on: ci-base
    outputs:
      # "true" when deploy/OFF is in the run's commit. Every job below carries
      # the same value as a job-level condition.
      off: ${{ steps.off.outputs.off }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the tree is read, and no later step needs a credential.
          persist-credentials: false

      - name: Check whether the app is off on purpose
        id: off
        run: |
          set -euo pipefail

          if [[ -f deploy/OFF ]]; then
            msg='app is off on purpose (deploy/OFF): staging deploy and integration skipped'
            printf '::notice::%s\n' "$msg"
            printf '%s\n' "$msg" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            printf 'off=true\n' >>"${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi

          printf 'deploy/OFF is not there; this run goes on to deploy and test %s\n' "$GITHUB_SHA"
          printf 'off=false\n' >>"${GITHUB_OUTPUT:-/dev/null}"

  # Whether this run is still the run main is at, decided once, before anything
  # else but the check above. It is a job of its own, and that is the whole point
  # of it (bead dv-7gsb): the answer has to be the *run's* status, not a step
  # inside a job. A job that gates its own steps on a read still ends with
  # status success, and a superseded run whose three jobs each report success
  # is a commit the release bot reads as deployed and tested.
  #
  # It runs on the CI runner and holds nothing: the read is `git ls-remote`
  # against the repository over HTTP, so it needs no checkout, no token and no
  # key path. It reads nothing and changes nothing, which is what lets it be the
  # job every other job waits on.
  fresh:
    runs-on: ci-base
    # An app that is off has nothing to deploy, so there is nothing to compare
    # with main either: the job is skipped, and so is everything that needs it.
    needs: off
    if: needs.off.outputs.off != 'true'
    outputs:
      # "true" when main has moved past the commit this run was started for.
      # Every job below carries the same value as a job-level if, so the run's
      # jobs are skipped rather than successful-and-empty.
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      # Both ways this read can fail deploy-and-test rather than skip. A wrong
      # skip is invisible -- staging quietly stops tracking main and nothing
      # says so -- while a wrong deploy publishes a commit that is on main and
      # passed the gate, which is what a landing run is for.
      - name: Check whether main has moved past this run's commit
        id: stale
        run: |
          set -euo pipefail

          # Read from the repository, not from a checkout: this job makes none,
          # and the ref in question is the remote's main, not the ref the run
          # started at. It is read by URL for that reason.
          if [[ -z ${GITHUB_SERVER_URL:-} || -z ${GITHUB_REPOSITORY:-} ]]; then
            printf '::notice::the runner names no server or repository, so main cannot be read\n'
            printf 'deploying and testing %s rather than skipping it silently\n' "$GITHUB_SHA"
            printf 'stale=false\n' >>"${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          if ! out=$(git ls-remote "$remote" refs/heads/main 2>/dev/null); then
            printf '::notice::could not read main from %s\n' "$remote"
            printf 'deploying and testing %s rather than skipping it silently\n' "$GITHUB_SHA"
            printf 'stale=false\n' >>"${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi

          main=${out%%[[:space:]]*}
          if [[ -n $main && $main != "$GITHUB_SHA" ]]; then
            printf '::notice::main is at %s and this run is for %s\n' "$main" "$GITHUB_SHA"
            printf 'a newer landing has superseded this run; nothing is deployed and nothing is tested\n'
            printf 'stale=true\n' >>"${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi

          printf 'main is still at %s; this run deploys and tests it\n' "$GITHUB_SHA"
          printf 'stale=false\n' >>"${GITHUB_OUTPUT:-/dev/null}"

  # Build the commit main is at and push it. The digest this prints is the
  # landing's identity for the job below; nothing between the two rebuilds it.
  build:
    runs-on: deploy
    needs: [off, fresh]
    # A superseded run, and a run of an app that is off, do nothing at all, and
    # this is the condition that says so: at the job level, so the job's status is
    # skipped rather than success.
    if: needs.off.outputs.off != 'true' && needs.fresh.outputs.stale != 'true'
    # The base key, as a path the deploy runner mounts, mode 600, inside a home
    # only gt-cloud can read (deploy.yml states why it is a path and never a
    # Forgejo secret). It is a job variable here and not a workflow one so that
    # the `fresh` and `integration` jobs — which run on the runner that mounts
    # nothing — do not inherit it.
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build_push_staging.sh reads origin/main to check that HEAD is on
          # main, and a shallow clone does not carry the remote-tracking ref.
          fetch-depth: 0
          persist-credentials: false

      # Each job mints its own token: a token is good for an hour and one job,
      # and separate jobs do not share a filesystem. The scripts print notes and
      # a final block of key=value lines on stdout, so the machine lines are
      # taken by matching their shape rather than by reprinting every line into
      # $GITHUB_OUTPUT.
      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          out="$(scripts/release/mint_token.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Build main's commit and push it
        id: push
        env:
          # The ref the run is at. The build refuses one that looks like a
          # release tag, because a dispatch names any ref it likes and a `v*`
          # tag is the release flow's to build.
          REF: ${{ github.ref }}
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/build_push_staging.sh --ref "$REF" --token-file "$TOKEN_FILE")"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

  # Apply the build's digest to staging and check that it answers. This job
  # changes something, and what it changes is staging and only staging.
  staging:
    runs-on: deploy
    # Both, and each for its own reason: `fresh` carries the job-level condition
    # that a superseded run deploys nothing, and `build` carries the digest this
    # job applies. A backlog of queued landings would otherwise replay old
    # commits in order, and each one would roll staging back behind the landing
    # that came after it.
    needs: [build, off, fresh]
    if: needs.off.outputs.off != 'true' && needs.fresh.outputs.stale != 'true'
    # The same mount the build job states, for the same reason: this job mints a
    # token and applies a digest, and both need the base key.
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    outputs:
      # The URL of the service this run's apply wrote, for the integration job
      # below: it tests the service the run deployed, and it does not look one up
      # for itself. A run that never reaches this job exports nothing.
      url: ${{ steps.up.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This job needs the tree the scripts and the committed stack settings
          # live in, not the history: nothing here reads a commit.
          persist-credentials: false

      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          out="$(scripts/release/mint_token.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      # No preview and no approval: a release writes a plan for a human to read
      # before staging changes, and a landing has nothing of the kind to show --
      # the digest it applies is one main already carries, and nobody is waiting
      # to approve it. up.sh applies with --skip-preview, which here means no
      # preview happens at all, and it applies the digest the build job printed
      # and never a name.
      - name: Apply the landing's digest to staging
        id: up
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/up.sh --env staging --digest "$DIGEST" --token-file "$TOKEN_FILE")"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Check the staging service answers on its health path
        env:
          URL: ${{ steps.up.outputs.url }}
        run: scripts/release/health.sh --url "$URL" --health-path "$GT_HEALTH_PATH"

  # The integration tier (bead dv-sdpq): test the service the run above deployed,
  # so that "this commit is green on staging" is a fact about one commit rather
  # than about whatever staging happened to serve when a sweep fired.
  #
  # This job is on the CI runner and holds nothing: no key path, no token, no
  # cloud call. Everything it does is a read of the deployed service over HTTP —
  # the version wait, and the app's own suite — and what it writes is a job
  # result. That is what makes it the job a release can read: it cannot change
  # anything, so its answer cannot be one a broken run gave before it changed
  # something.
  integration:
    runs-on: ci-base
    # As the staging job: `staging` is the deploy whose commit this job tests,
    # and `fresh` is the job-level condition that keeps a superseded run from
    # testing a service some newer landing owns.
    needs: [staging, off, fresh]
    if: needs.off.outputs.off != 'true' && needs.fresh.outputs.stale != 'true'
    # The version wait polls for up to 300s by default and the app's suite is the
    # app's own; the job names a bound of its own so that a service that never
    # settles cannot hold a runner past it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The app's own integration suite, and the Makefile that runs it, live
          # in this repository; this job reads no commit, so the checkout carries
          # no history and leaves no token in .git/config behind it.
          persist-credentials: false

      # A health check is not this fact. A revision that answers on its health
      # path can still be the one before it, so this step polls until the
      # service reports the commit the run deployed: wait_version.sh exits 1 when
      # the service reports another commit and 2 when it never gives an answer,
      # and both fail the job. The commit is what ties the tests below to this
      # run; without it they would pass against whatever is up.
      - name: Wait for the service to report the commit this run deployed
        env:
          STAGING_URL: ${{ needs.staging.outputs.url }}
        run: |
          set -euo pipefail
          scripts/release/wait_version.sh --url "$STAGING_URL" --sha "$GITHUB_SHA"

      # The app's own tests against the deployed service. Both values reach make
      # as command-line variables and through the environment, never as text
      # interpolated into this script: STAGING_URL is where to test, EXPECT_SHA
      # is the commit the service has to report, so a suite cannot pass by
      # testing whatever happens to be up.
      - name: Run the app's integration tests against the deployed service
        env:
          STAGING_URL: ${{ needs.staging.outputs.url }}
        run: |
          set -euo pipefail

          # An app that has not written its integration tier yet is a failure
          # here, and it has to say which contract is missing rather than leave
          # the job's reader with make's own "No rule to make target": an app
          # with no tests and an app whose tests failed are different findings.
          if ! target_err=$(make --dry-run integration 2>&1 >/dev/null); then
            printf '::error::%s has no `make integration` target, so this run cannot say whether\n' "$GT_APP"
            printf 'the commit it deployed is green. Define one: `make integration\n'
            printf 'STAGING_URL=<url> EXPECT_SHA=<commit>` must test the service at %s and exit\n' "$STAGING_URL"
            printf 'non-zero unless it reports commit %s\n' "$GITHUB_SHA"
            printf '%s\n' "$target_err"
            exit 1
          fi

          make integration STAGING_URL="$STAGING_URL" EXPECT_SHA="$GITHUB_SHA"
