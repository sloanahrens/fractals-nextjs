# Deploy workflow template for an app repo (docs/plan.md, bead B5.3; the flow it
# implements is docs/design.md, section 6).
#
# Copy this file into an app repo as .forgejo/workflows/deploy.yml. It runs the
# release scripts the app repo carries at the tagged commit (scripts/release/,
# copied from this repo — workflows/README.md says which revision and why), one
# job per phase of the release flow: build and push the tag, preview staging,
# deploy the tag's digest to staging, promote that same digest to prod, and run
# the app's own integration tier against prod.
#
# Nothing here holds a credential. The base key is a file on the deploy runner
# (GT_BASE_KEY_FILE), mint_token.sh turns it into a one-hour token for the app's
# deployer service account, and every script hands that token to a tool through
# the environment, never through a command line (scripts/release/README.md).
# Every job that touches the cloud runs on `runs-on: deploy`: that label is the
# only runner with the key and a container runtime, and Forgejo restricts it to
# the app and devops repos (bead B5.4). The ci-base gate runner never sees a
# credential, and the one job here that runs on it, `prod-integration` (bead
# dv-jokk.1), is why GT_BASE_KEY_FILE is declared on the four jobs that run on
# the deploy runner rather than at the top of the file: a workflow-level
# variable is inherited by every job, and an inherited variable is a key path
# the job holds (staging.yml states the same rule).
#
# Release identity is the digest the first job prints. Every later job deploys
# that value, prod takes it from the staging job's output, and promote.sh
# refuses anything that differs from what staging proved — so nothing between
# staging and prod can rebuild or re-tag the image.
#
# The ref the run is at decides the release, and the build job decides that ref
# twice before it builds anything: the ref has to be a protected release tag,
# and the commit that tag points at has to be one main carries. The tag name
# alone cannot decide the second — a token allowed to push tags can put a `v*`
# tag on any commit — so a release is only ever a commit main has landed, which
# is the same rule build_push_staging.sh enforces for a landing. The build job
# states both checks where they run.
#
# Each checkout sets persist-credentials: false. The checkout is the one thing
# that needs the runner's own repository token, and this keeps it from writing
# that token into .git/config where a later step could use it without naming it.

name: deploy

# A release starts at a protected `v*` tag pushed by the human. This file is
# code the deploy runner executes with a cloud credential in scope, so the
# revision that decides what it runs has to be one no worker can push
# (docs/design.md, section 5). The tag push is not, on this instance, the only
# way the file can start — a dispatch runs the copy at the ref it names, a
# branch included — so the build job refuses any ref that is not a protected
# release tag before it does anything else, every other job needs build, and the
# branch protection rule over `.forgejo/workflows/` is what keeps that refusal
# from being removed by the account that pushes the ref (docs/design.md, section
# 6.1; bead dv-x3a). The tag push is also the release's approval. No job here
# declares an environment, because the Forgejo we run has no Actions
# environments at all: the keys this file used to carry were a hold that never
# held, and a release reached through a tag deployed with nobody approving.
# docs/design.md, section 6.1, is the decision and what replaces them; it is
# worth reading before adding an approval back here.
on:
  push:
    tags: ["v*"]

# One release at a time, and one teardown shares the group (teardown.yml uses
# the same one): two runs touching the same stack at once would let the run
# released last land the older digest, because the stack's imageDigest is one
# value both runs write. A queued run waits its turn; nothing cancels a release
# half-way, which would be worse than waiting.
#
# Forgejo documents this key, but its Actions engine is Gitea's: older versions
# listed `concurrency` among the keys they ignore, so the queueing is not
# something to assume. It was measured on this instance instead of assumed
# (bead dv-shob; workflows/README.md): the runs held one at a time in dispatch
# order, an arriving run queued behind a run already waiting rather than
# cancelling it — which is where this engine differs from GitHub — and the
# control with cancel-in-progress: true cancelled a running run, so false here
# is what keeps a release alive and not a key nobody reads.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  # The app's name, which is its repository's name (pkg/appdeploy Spec.Name, and
  # the manifest's app field: manifests/fractals.yaml states the rule and why the
  # two sides of the deploy system have to agree on one name — this job can read
  # nothing but the repository it runs in, and bootstrap names the app's service
  # accounts from the manifest). Set GT_APP explicitly when the repository is not
  # named after the app, which is the case a repository name too long for a GCP
  # account id forces (manifests/abc.yaml); release_target in
  # scripts/release/lib.sh refuses anything that is not ^[a-z][a-z0-9-]{1,28}$.
  GT_APP: ${{ github.event.repository.name }}
  # The app's GCP project. It is not derived from the app's name: the project ID
  # is fixed when bootstrap creates it, and the first app's is gt-fractals-m4xq where
  # its name is fractals-nextjs (manifests/fractals.yaml). A release that guessed
  # gt-<GT_APP> would push an image to a project that does not exist and mint a
  # token for an account in it.
  GT_PROJECT: gt-fractals-m4xq
  # The app's Pulumi program. A release changes one value in it, imageDigest,
  # and the rest of the Spec stays in Pulumi.<env>.yaml (bead B4.5).
  GT_STACK_DIR: deploy
  # The health path declared in the app's Spec (docs/plan.md, bead B4.5).
  GT_HEALTH_PATH: /api/health
  # The images the app releases, from its registry entry's `images:` (apps/<app>.yaml,
  # printed as GT_IMAGES by `appsctl env`). `app` is the one image built from
  # Dockerfile at the app's own registry path; the scripts read this variable
  # themselves, so naming more builds and pins more (scripts/release/lib.sh,
  # "Named images").
  GT_IMAGES: app

jobs:
  # Every job below names a timeout-minutes, and every number is a measurement
  # rather than a guess (bead dv-96nw). A release is the flow where a job with
  # no bound costs the most: it holds the deploy runner the repository has one
  # of, and every later run of every workflow in the repo queues behind it until
  # a human cancels it. staging.yml states the rule these numbers come from and
  # the 2026-10-15 hang that produced it; what is specific to this file is that
  # its jobs are the release's, so the numbers below are the p95 over the runs
  # of `v*` tags, which are fewer and slower than a landing's.
  #
  # Step 2 of the flow: build the tag and push it to the app's registry. The
  # digest this prints is the release's identity from here on.
  build:
    runs-on: deploy
    # The same build staging.yml's `build` job runs, and measured over 19
    # releases: p95 12s (a cold one is 26s) and a floor of five minutes by the
    # rule. The bead names 20 for it and it is the same number here, for the
    # same reason: the step inside it carries an eight-minute bound and one
    # automatic retry (scripts/release/build_push.sh, lib.sh), and this job has
    # to hold two of those plus the checkout and the token.
    timeout-minutes: 20
    # The base key, as a path: the deploy runner mounts it mode 600 inside a home
    # only gt-cloud can read (bead B5.4). Never key material, and never a Forgejo
    # secret — a workflow file is editable by any worker, a mount is not. It is
    # declared on the jobs that run on the deploy runner and not at the top of the
    # file, so that prod-integration, which runs on the runner that mounts no key,
    # does not inherit it.
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      # The other images of GT_IMAGES as NAME=DIGEST pairs; empty for the one-image app.
      images: ${{ steps.push.outputs.images }}
    steps:
      # First, before the checkout and before any call that touches the cloud:
      # a run that is not at a protected release tag is refused here, and every
      # job that changes a running service needs this one.
      #
      # The tag push (above) is what starts a release. It is not the only way
      # this file can start: Forgejo will dispatch it at any ref the dispatcher
      # names, and the copy it runs is the copy at that ref, not this one
      # (docs/design.md, section 6.1; bead dv-x3a). So the start has to be
      # decided by the ref the run is at, and that check lives here rather than
      # in a script, so that a run which is not a release never reaches the
      # first cloud call. It checks the whole ref, not the name: a branch named
      # `v1.2.3` passes the name check require_release_tag makes in
      # build_push.sh, and a branch is exactly the ref a worker can push.
      #
      # What makes this step a control rather than a comment is the other half:
      # no push can put another copy of this file on a branch. That is the
      # branch protection rule scripts/verify_forgejo_protection.sh verifies
      # under workflow.protection (docs/design.md, section 6.1).
      #
      # This is the first of the two ref checks the build makes. It reads the
      # tag's name; the step after the checkout reads the commit that name
      # points at.
      - name: Refuse anything but a protected release tag
        run: |
          set -euo pipefail
          if [[ ! $GITHUB_REF =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            printf 'refusing a release outside a protected release tag: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          printf 'release %s at %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - uses: actions/checkout@v4
        with:
          # build_push.sh refuses a checkout that is not exactly at the tag, and
          # that check wants the tag's own ref rather than a shallow clone. The
          # step after this one compares the tag's commit with main, which is a
          # read of origin/main: only a full-history checkout carries it.
          fetch-depth: 0
          persist-credentials: false

      # And the commit the tag points at has to be one main carries.
      #
      # The step above reads the tag's name, and a name is a string: an account
      # allowed to push tags can put `v1.2.3` on any commit it can reach, and
      # this file is the code the deploy runner executes with a cloud
      # credential in scope. Requiring the commit to be one main carries is what
      # ties a release to the commits that passed the landing gate, and
      # build_push_staging.sh applies the same rule, through the same git read,
      # to a landing.
      #
      # origin/main here is the checkout's own remote-tracking ref: the checkout
      # above fetches the full history, so main is a local ref and this step
      # makes no network call and needs no credential. A checkout without it
      # fails the run instead of skipping the check, because a release whose
      # ancestry could not be read is exactly the release this step exists to
      # stop; the message says which part is missing.
      #
      # The step runs before the token is minted and before anything is built or
      # pushed, so a run it refuses reads no credential and changes nothing.
      - name: Refuse a release tag whose commit is not on main
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            printf 'refusing the release tag %s: this checkout has no origin/main, so its commit cannot be\n' \
              "$GITHUB_REF_NAME" >&2
            printf 'checked against main, and a release tag must point at a commit on main\n' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            printf 'refusing a release tag whose commit is not on main: %s at %s\n' \
              "$GITHUB_SHA" "$GITHUB_REF_NAME" >&2
            printf 'a release tag must point at a commit on main, and this one is not an ancestor of origin/main\n' >&2
            exit 1
          fi
          printf 'release tag %s points at %s, which is on main\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"

      # Each job mints its own token: a token is good for an hour and one job,
      # and separate jobs do not share a filesystem. The scripts print notes and
      # a final block of key=value lines on stdout, so the machine lines are
      # taken by matching their shape rather than by reprinting every line into
      # $GITHUB_OUTPUT.
      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          # The capture holds what the script writes on stdout, and a failure
          # ends the step at the assignment, before the print below can show
          # any of it: print what it wrote, then fail with its own status.
          out="$(scripts/release/mint_token.sh)" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Build the tag's image and push it
        id: push
        env:
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/build_push.sh --tag "$GITHUB_REF_NAME" --token-file "$TOKEN_FILE")" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

  # Step 4 of the flow: the preview the release is read from. It runs before
  # the staging job, so the plan is written down before anything changes. On a
  # Forgejo with environments this was the diff an approver read before
  # releasing the job; with none it is the record of what the release does
  # (docs/design.md, section 6.1). The diff is not a secret and not large: it
  # goes in the log and in the run summary, next to the release record.
  staging-preview:
    runs-on: deploy
    needs: build
    # The plan a human reads before staging changes, and p95 67s over 20
    # releases: twice it is 134s, so the rule leaves this at its five-minute
    # floor.
    timeout-minutes: 5
    # The base key's path, on this job and not at the top of the file (see build).
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          out="$(scripts/release/mint_token.sh)" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Preview the staging deploy over the digest that was built
        id: preview
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          GT_IMAGE_DIGESTS: ${{ needs.build.outputs.images }}
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/preview.sh --env staging --digest "$DIGEST" --token-file "$TOKEN_FILE")" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Attach the plan to the run record
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          PREVIEW_FILE: ${{ steps.preview.outputs.preview_file }}
        run: |
          set -euo pipefail
          cat "$PREVIEW_FILE"
          {
            printf '### Staging preview for `%s`\n\n' "$GT_APP"
            printf 'digest `%s`\n\n' "$DIGEST"
            printf 'The staging job applies exactly this plan, in this run.\n\n'
            printf '````\n'
            cat "$PREVIEW_FILE"
            printf '````\n'
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

  # Step 5 of the flow: apply the tag's digest to staging and check its health.
  # No environment, and nothing waits in front of this job: the tag push in step
  # 1 is the release's authorization and the preview above is the record of what
  # it does (docs/design.md, section 6.1). Nothing here rebuilds: up.sh deploys
  # the digest the build job printed and the preview above described, and it
  # runs with --skip-preview so there is no second, unread plan of the same
  # change.
  #
  # A failed health check fails this job and stops the release. Nothing is
  # rolled back: recovery is redeploying the previous digest through this same
  # flow, by hand (docs/design.md, section 6).
  staging:
    runs-on: deploy
    # build is named as well as staging-preview because this job reads the
    # digest out of build's output: `needs` resolves the outputs of a job's
    # direct dependencies, and a job only reachable through another job is not
    # one of them. workflows_test.go checks every `needs.<job>.outputs.<key>`
    # reference against the job's own needs list.
    needs: [build, staging-preview]
    # Applying the release's digest and waiting for the revision to serve is p95
    # 107s over 11 releases, so twice it is under four minutes and the rule would
    # leave this at its floor; the bead names 15, the number staging.yml's own
    # staging job carries.
    timeout-minutes: 15
    # The base key's path, on this job and not at the top of the file (see build).
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    outputs:
      digest: ${{ needs.build.outputs.digest }}
      images: ${{ needs.build.outputs.images }}
      url: ${{ steps.up.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          out="$(scripts/release/mint_token.sh)" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Apply the tag's digest to staging
        id: up
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          GT_IMAGE_DIGESTS: ${{ needs.build.outputs.images }}
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/up.sh --env staging --digest "$DIGEST" --token-file "$TOKEN_FILE")" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Check the staging service answers on its health path
        env:
          URL: ${{ steps.up.outputs.url }}
        run: scripts/release/health.sh --url "$URL" --health-path "$GT_HEALTH_PATH"

  # Step 6 of the flow: the same digest in prod. This job carries no
  # environment and no preview job of its own: prod gets the plan staging
  # already ran under the tag's authorization, and promote.sh refuses a digest
  # that is not the one the staging stack holds, so "prod runs what staging
  # proved" is checked rather than assumed (docs/design.md, section 6.1).
  prod:
    runs-on: deploy
    needs: staging
    # Promoting the digest staging proved and waiting for prod to serve it is p95
    # 134s over 20 releases (the slowest is 140s), so twice it is four and a
    # half minutes and the rule leaves this at its five-minute floor.
    timeout-minutes: 5
    # The base key's path, on this job and not at the top of the file (see build).
    env:
      GT_BASE_KEY_FILE: /Users/gt-cloud/.config/gt/base-key.json
    # The URL of the service this run's promotion wrote, for prod-integration
    # below: it tests the service the run deployed and does not look one up for
    # itself.
    outputs:
      url: ${{ steps.promote.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint a one-hour token for the app's deployer service account
        id: token
        run: |
          set -euo pipefail
          out="$(scripts/release/mint_token.sh)" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      # The digest staging actually runs, read back out of what Pulumi recorded
      # for its stack rather than assumed from the job output. promote.sh
      # refuses a digest that differs from this one, so "prod gets the image
      # staging proved" is a check against the stack itself and not against a
      # value both jobs happen to share.
      #
      # It has to be the stack's *state* and not its config: the staging job
      # pins the digest with `pulumi config set imageDigest`, which writes a file
      # in that job's own checkout — a job's workspace, which this job does not
      # share and which is never committed — so the first real release
      # (fractals-nextjs, 2026-10-08) failed here with `configuration key
      # 'imageDigest' not found for stack 'staging'`. Stack state lives in the
      # backend every job of a release can read, and the Cloud Run service the
      # stack applied records the image it is running; staged_digest.sh reads
      # that, and refuses a stack with no service, more than one, or an image
      # that is a tag — an empty read would leave promote.sh's --staging-digest
      # unset, and promote.sh skips the comparison when it is empty.
      - name: Read the digest the staging stack is running
        id: staged
        env:
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/staged_digest.sh --env staging --token-file "$TOKEN_FILE")" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Promote the staging digest to prod
        id: promote
        env:
          DIGEST: ${{ needs.staging.outputs.digest }}
          GT_IMAGE_DIGESTS: ${{ needs.staging.outputs.images }}
          STAGING_DIGEST: ${{ steps.staged.outputs.digest }}
          TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        run: |
          set -euo pipefail
          out="$(scripts/release/promote.sh "$DIGEST" --staging-digest "$STAGING_DIGEST" --token-file "$TOKEN_FILE")" || {
            status=$?
            printf '%s\n' "$out"
            exit "$status"
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E '^[a-z_]+=' >>"$GITHUB_OUTPUT"

      - name: Check the prod service answers on its health path
        env:
          URL: ${{ steps.promote.outputs.url }}
        run: scripts/release/health.sh --url "$URL" --health-path "$GT_HEALTH_PATH"

      # Step 7 of the flow: the run summary, which is where a release is read
      # from afterwards. There is no approval to record on this instance, so the
      # summary names the tag push as the authorization, and the tag's pusher is
      # the only name the workflow can see (docs/design.md, section 6.1).
      - name: Record the release in the run summary
        env:
          DIGEST: ${{ needs.staging.outputs.digest }}
          STAGING_URL: ${{ needs.staging.outputs.url }}
          PROD_URL: ${{ steps.promote.outputs.url }}
        run: |
          set -euo pipefail
          # The three runner variables are defaulted rather than required:
          # this runs after prod is deployed, and a missing one of them should
          # not turn a release that landed into a failed run.
          {
            printf '### Released `%s`\n\n' "$GT_APP"
            printf '| | |\n|---|---|\n'
            printf '| tag | `%s` |\n' "${GITHUB_REF_NAME:-unknown}"
            printf '| commit | `%s` |\n' "${GITHUB_SHA:-unknown}"
            printf '| digest | `%s` |\n' "$DIGEST"
            printf '| staging | %s |\n' "$STAGING_URL"
            printf '| prod | %s |\n' "$PROD_URL"
            printf '| tag pushed by | %s |\n' "${GITHUB_ACTOR:-unknown}"
            printf '\n'
            printf 'Prod runs the digest staging proved, and no step between the two rebuilt anything.\n'
            printf 'No approval is recorded: this Forgejo has no Actions environments,\n'
            printf 'so the tag push above is the release authorization (docs/design.md, section 6.1).\n'
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

  # Step 8 of the flow, and the last (bead dv-jokk.1): the app's own integration
  # tier against prod, so "this release is green" is a fact about the commit the
  # tag names and not about whatever prod happens to serve when a sweep fires.
  # It is staging.yml's integration job one environment later: wait for the
  # service to report the tag's commit, then run the app's own make target
  # against it. The target is `integration-prod` and not `integration`, because
  # the staging suite may write to the service it tests and prod's is read-only.
  #
  # This job is on the CI runner and reaches for nothing: no key path, no token,
  # no cloud call, and it names the run's repository token nowhere. What it does
  # is read the deployed service over HTTP, and what it writes is a job result,
  # so it cannot change what prod serves. A failure here is a red job on a
  # release that already reached prod: nothing is rolled back, because recovery
  # is a human redeploying the previous digest through this same flow
  # (docs/design.md, section 6). `needs: prod` means a release that never
  # reached prod skips this job rather than reporting a pass.
  #
  # The name is a constant: the promotion plugin reads this job's result by it,
  # and a rename would read as "no prod integration ran".
  prod-integration:
    runs-on: ci-base
    needs: prod
    # The version wait polls for up to 300s by default and the app's suite is the
    # app's own. The bound is the one staging.yml, up.yml and health.yml give the
    # same suite, so a service that never settles cannot hold a runner past it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The app's own suite and the Makefile that runs it are in this
          # repository at the tag; this job reads no history and leaves no token
          # in .git/config behind it.
          persist-credentials: false

      # A health check is not this fact: a revision that answers on its health
      # path can still be the one before it. wait_version.sh exits 1 when prod
      # reports another commit and 2 when it never answers, and both fail the
      # job. GITHUB_SHA is the commit the tag points at, which the build job
      # proved is one main carries.
      - name: Wait for prod to report the commit this release names
        env:
          PROD_URL: ${{ needs.prod.outputs.url }}
        run: |
          set -euo pipefail
          scripts/release/wait_version.sh --url "$PROD_URL" --sha "$GITHUB_SHA"

      # Both values reach make as command-line variables and through the
      # environment, never as text interpolated into the script, so a suite
      # cannot pass by testing whatever happens to be up.
      - name: Run the app's integration tests against prod
        env:
          PROD_URL: ${{ needs.prod.outputs.url }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # An app without the target is a failure that names the contract, as
          # staging.yml's is: an app with no prod tests and an app whose prod
          # tests failed are different findings.
          if ! target_err=$(make --dry-run integration-prod 2>&1 >/dev/null); then
            printf '::error::%s has no `make integration-prod` target, so this run cannot say whether\n' "$GT_APP"
            printf 'the release it deployed is green. Define one: `make integration-prod\n'
            printf 'PROD_URL=<url> EXPECT_SHA=<commit>` must test the service at %s read-only and exit\n' "$PROD_URL"
            printf 'non-zero unless it reports commit %s\n' "$EXPECT_SHA"
            printf '%s\n' "$target_err"
            exit 1
          fi

          make integration-prod PROD_URL="$PROD_URL" EXPECT_SHA="$EXPECT_SHA"
